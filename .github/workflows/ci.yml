
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: csc_test
          POSTGRES_PASSWORD: csc_test_only
          POSTGRES_DB: csc_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U csc_test -d csc_crm_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Disposable CI-only database; these are not real credentials.
      TEST_DATABASE_URL: postgresql+psycopg://csc_test:csc_test_only@localhost:5432/csc_crm_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          working-directory: backend

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Lint backend
        working-directory: backend
        run: uv run ruff check app tests

      - name: Check backend formatting
        working-directory: backend
        run: uv run ruff format --check app tests

      - name: Test backend
        working-directory: backend
        run: uv run pytest
